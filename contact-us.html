<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Student Hub</title>

    <!-- Same CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">   
     <nav class="navbar">

        <div class="logo">
            <img src="https://img.icons8.com/bubbles/1200/charotar-university.jpg"
                 alt="University Logo" 
                 width="50"
                 height="50">
            <h2>Student Hub</h2>
        </div>

    </nav>

     

        <div class="nav">
            <a href="index.html">Home</a>

            <a href="contact-us.html" class="nav-btn">Contact us</a>
            <a href="faq.html" class="nav-btn">FAQ</a>
            
        </div>

    </nav>

</header>

    <!-- =========================
         CONTACT US
    ========================== -->

    <main>

        <div class="contact-container">

            <h2>Contact Us</h2>

            <p>
                Have a question or need help?
                Send us a message and we will get back to you.
            </p>


            <form class="student-form ">

                <!-- Name -->

                <label for="name">
                    Full Name
                </label>

                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your full name"
                       required>


                <!-- Email -->

                <label for="email">
                    Email Address
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>


                <!-- Subject -->

                <label for="subject">
                    Subject
                </label>

                <input type="text"
                       id="subject"
                       name="subject"
                       placeholder="Enter subject"
                       required>


                <!-- Message -->

                <label for="message">
                    Message
                </label>

                <textarea id="message"
                          name="message"
                          rows="5"
                          placeholder="Write your message here..."
                          required></textarea>


                <!-- Submit -->

                <button type="submit">
                    Send Message
                </button>

            </form>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 Student Hub Portal
        </p>

    </footer>


    
</body>

</html>
