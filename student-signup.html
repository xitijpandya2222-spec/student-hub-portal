<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body >
    <header class="header">   
     <nav class="navbar">

        <div class="logo">
            <img src="https://img.icons8.com/bubbles/1200/charotar-university.jpg"
                 alt="University Logo" 
                 width="50"
                 height="50">
            <h2>Student Hub</h2>
        </div>

    </nav>

        <div class="nav">
            <a href="student_auth.html" class="nav-btn">Back</a>
        
            
        </div>

    </nav>

</header>

    <h1>Student Registration</h1>

        <p class="registration-subtitle">
            Create your Student Hub account.
        </p>


        <!-- REGISTRATION FORM -->
        <form class="student-form">

    <h2>Student Registration</h2>

    <label>Full Name</label>
    <input type="text" placeholder="Enter your full name">

    <label>Enrollment Number</label>
    <input type="text" placeholder="Enter enrollment number">

    <label>Email Address</label>
    <input type="email" placeholder="Enter your email">

    <label>Phone Number</label>
    <input type="tel" placeholder="Enter your phone number">

    <label>Password</label>
    <input type="password" placeholder="Create password">

    <label>Confirm Password</label>
    <input type="password" placeholder="Confirm password">

    <a href="student-dashboard.html">
        <button type="button">Register</button>
    </a>

    <p>
        Already have an account?
        <a href="student-login.html">Login</a>
    </p>

</form>
 <footer>
        <p>© 2026 Student Hub Portal</p>
    </footer>

       
</body>

</html>
